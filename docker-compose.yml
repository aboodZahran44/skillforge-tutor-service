services:
  tutor-db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: tutor_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - tutor_postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  tutor-service:
    build: .
    volumes:
      - .:/app
    ports:
      - "8001:8001"
    environment:
      environment:
      DATABASE_URL: postgresql://postgres:postgres@tutor-db:5432/tutor_service
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    depends_on:
      - tutor-db

volumes:
  tutor_postgres_data: